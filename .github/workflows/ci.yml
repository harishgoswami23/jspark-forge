# JSPARK Forge CI.
# - unit:        every push and pull request; Windows, macOS, Linux x Node 18, 22, 24. Free (no API calls).
# - validate:    `claude plugin validate --strict` (design 13, spec 7 acceptance).
# - integration: the v0.1 SHIP GATE (kill and resume) + hook-fire + headless, on all three systems, against real
#                Claude Code. Uses the owner's Claude subscription, so it runs only on pushes to main or when started by hand
#                (Actions tab -> CI -> Run workflow), and only when the repository secret CLAUDE_CODE_OAUTH_TOKEN exists (from: claude setup-token).
#                A fresh runner is the "cold machine" of design 13.
name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run the integration tests (uses the CLAUDE_CODE_OAUTH_TOKEN secret)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for test repositories
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
      - run: npm test

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install Claude Code (native installer)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate --strict .

  integration:
    name: integration / ship gate (${{ matrix.os }})
    needs: [unit, validate]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.integration) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FORGE_IT_MODEL: haiku
    steps:
      # Without the secret: a manual run fails with a clear message; a push skips quietly (no red X on main).
      - name: check the API key secret
        id: key
        shell: bash
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is not set (run: claude setup-token) (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "::notice::Integration tests skipped: repository secret CLAUDE_CODE_OAUTH_TOKEN is not set."
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: git identity for test repositories
        if: steps.key.outputs.ok == 'true'
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: install Claude Code (macOS, Linux)
        if: steps.key.outputs.ok == 'true' && runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install Claude Code (Windows)
        if: steps.key.outputs.ok == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: claude --version
        if: steps.key.outputs.ok == 'true'
      # v0.5 ship gate: first say what Claude Code loaded (plugins, plugin_errors, the plugin's servers, hook lines),
      # so a job where no hook fires shows why.
      - name: plugin load report
        if: steps.key.outputs.ok == 'true'
        run: node --test tests/integration/load.it.js
      - name: integration tests (hook-fire, headless, kill and resume)
        if: steps.key.outputs.ok == 'true'
        run: npm run test:integration
