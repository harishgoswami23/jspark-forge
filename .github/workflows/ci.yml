# JSPARK Forge CI.
# - unit:        every push and pull request; Windows, macOS, Linux x Node 18, 22, 24. Free (no API calls).
# - validate:    `claude plugin validate --strict` (design 13, spec 7 acceptance).
# - integration: the v0.1 SHIP GATE (kill and resume) + hook-fire + headless, on all three systems, against real
#                Claude Code. Costs API usage, so it runs only on pushes to main or when started by hand
#                (Actions tab -> CI -> Run workflow), and only when the repository secret ANTHROPIC_API_KEY exists.
#                A fresh runner is the "cold machine" of design 13.
name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run the integration tests (uses the ANTHROPIC_API_KEY secret)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for test repositories
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
      - run: npm test

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install Claude Code (native installer)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate --strict .

  integration:
    name: integration / ship gate (${{ matrix.os }})
    needs: [unit, validate]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.integration) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FORGE_IT_MODEL: haiku
    steps:
      - name: check the API key secret
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: git identity for test repositories
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: install Claude Code (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: claude --version
      - name: integration tests (hook-fire, headless, kill and resume)
        run: npm run test:integration
